# CI (DR-0007, DR-0009): lint, tests, determinism, cross-platform agreement, every M1
# Proof check, the comparison against the committed GMAT reference, and the M2 Proof
# (O1-O9, approved thresholds, DR-0023). GMAT itself is never installed or run in CI.
# The m2-cross-platform job is the DR-0023 three-platform final-state gate: it compares
# the evidence that the three required platforms (DR-0008 matrix) produced in THIS run.
# Recording-only (OD-10 recording scope): each numerical Python process, including child
# processes, writes its own ENV/lock record bound to run/job/attempt/sha (.github/recording/);
# pytest writes JUnit. Records and JUnit are uploaded even on failure. No command, threshold,
# platform or dependency is changed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The DR-0008 platform matrix (DR-0023 decision 4): Linux x86_64, macOS arm64,
        # macOS x86_64 (a GitHub Intel runner; the reference host itself enters through
        # the committed golden record, proof/references/m2_final_states.json).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      S3REC_SUBJECT: ${{ github.workspace }}
      S3REC_ENVCAP: ${{ github.workspace }}/.github/recording/envcap_ci.py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      # Recording-only (OD-10 recording scope): install the inert bootstrap into the job's venv.
      # It writes nothing unless a step sets S3REC_DIR; records go to $RUNNER_TEMP, outside the
      # checkout, so the clean-tree evidence and numerical commands are unchanged.
      - name: Install recording bootstrap (recording-only)
        shell: bash
        run: |
          purelib="$(.venv/bin/python -I -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          test ! -e "$purelib/sitecustomize.py"
          cp .github/recording/sitecustomize.py "$purelib/sitecustomize.py"
          cmp .github/recording/sitecustomize.py "$purelib/sitecustomize.py"
          for d in 01-m2-xp-collect 02-pytest 03-determinism-m1 04-cross-platform 05-gmat-m1-compare 06-m1-proof 07-m2-determinism 08-gmat-m2-compare 09-m2-proof 90-checker 91-checker-own junit; do mkdir -p "$RUNNER_TEMP/s3rec/$d"; done

      # First, from the clean checkout: the record must show a clean tree (DR-0023).
      - name: M2 cross-platform evidence (every canonical mission, this platform)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/01-m2-xp-collect
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 01-m2-xp-collect
        run: uv run python toolbox/validators/m2_cross_platform.py collect --out runs/xp/${{ matrix.os }}.json

      - name: Upload M2 cross-platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: m2-xp-${{ matrix.os }}
          path: runs/xp/${{ matrix.os }}.json
          if-no-files-found: error

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/02-pytest
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 02-pytest
        run: uv run pytest --junitxml="$RUNNER_TEMP/s3rec/junit/pytest.xml"

      - name: Cross-process determinism
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/03-determinism-m1
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 03-determinism-m1
        run: uv run python toolbox/validators/determinism.py

      - name: Cross-platform agreement with golden M1 state (DR-0006, DR-0008)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/04-cross-platform
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 04-cross-platform
        run: uv run python toolbox/validators/cross_platform.py

      - name: GMAT reference comparison (committed artifacts only; GMAT not installed, DR-0009)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/05-gmat-m1-compare
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 05-gmat-m1-compare
        run: uv run python toolbox/scripts/gmat_m1.py compare

      - name: M1 Proof (non-GMAT checks)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/06-m1-proof
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 06-m1-proof
        run: uv run python toolbox/validators/m1_proof.py --out runs/proof/m1_non_gmat_${{ matrix.os }}.json

      - name: M2 cross-process determinism (every M2 scenario)
        shell: bash
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/07-m2-determinism
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 07-m2-determinism
        run: |
          for s in scenarios/m2_*.json; do
            uv run python toolbox/validators/determinism.py --scenario "$s"
          done

      - name: M2 GMAT reference comparison (committed artifacts only; GMAT not installed)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/08-gmat-m2-compare
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 08-gmat-m2-compare
        run: uv run python toolbox/scripts/gmat_m2.py compare

      - name: M2 Proof (O1-O9, contract checks, golden cross-platform; approved thresholds)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/09-m2-proof
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 09-m2-proof
        run: uv run python toolbox/validators/m2_proof.py --out runs/proof/m2_${{ matrix.os }}.json

      - name: Upload Proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.os }}
          path: runs/proof/

      - name: Check recording completeness (recording-only)
        if: always()
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/90-checker
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 90-checker
        run: >-
          .venv/bin/python -I .github/recording/check_ci_records.py records --job check
          --platform ${{ matrix.os }} --root "$RUNNER_TEMP/s3rec" --out "$RUNNER_TEMP/s3rec/CHECK.json"

      # The completeness checker's own record exists only after it exits; this step checks it.
      # This step's own record is checked offline from the uploaded artifact.
      - name: Check the completeness checker's own record (recording-only)
        if: always()
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/91-checker-own
          S3REC_LABEL: ci ${{ github.job }} ${{ matrix.os }} 91-checker-own
        run: >-
          .venv/bin/python -I .github/recording/check_ci_records.py own --job check
          --platform ${{ matrix.os }} --dir "$RUNNER_TEMP/s3rec/90-checker"
          --check-json "$RUNNER_TEMP/s3rec/CHECK.json" --out "$RUNNER_TEMP/s3rec/OWN-CHECK.json"

      - name: Upload recording evidence (recording-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3rec-check-${{ matrix.os }}
          path: ${{ runner.temp }}/s3rec/
          if-no-files-found: error

  m2-cross-platform:
    # Runs even when a platform's check job failed, so missing evidence is reported as a
    # gate failure; it never passes without all three platforms' evidence from this run.
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      S3REC_SUBJECT: ${{ github.workspace }}
      S3REC_ENVCAP: ${{ github.workspace }}/.github/recording/envcap_ci.py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      # Recording-only (OD-10 recording scope): install the inert bootstrap into the job's venv.
      # It writes nothing unless a step sets S3REC_DIR; records go to $RUNNER_TEMP, outside the
      # checkout, so the clean-tree evidence and numerical commands are unchanged.
      - name: Install recording bootstrap (recording-only)
        shell: bash
        run: |
          purelib="$(.venv/bin/python -I -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          test ! -e "$purelib/sitecustomize.py"
          cp .github/recording/sitecustomize.py "$purelib/sitecustomize.py"
          cmp .github/recording/sitecustomize.py "$purelib/sitecustomize.py"
          for d in 01-m2-gate 90-checker 91-checker-own; do mkdir -p "$RUNNER_TEMP/s3rec/$d"; done

      - name: Download every platform's evidence from this run
        uses: actions/download-artifact@v4
        with:
          pattern: m2-xp-*
          path: runs/xp-in
          merge-multiple: true

      # The three files are named explicitly: a missing one is unreadable evidence and
      # fails the gate (fail closed).
      - name: M2 three-platform final-state gate (DR-0023 decision 4)
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/01-m2-gate
          S3REC_LABEL: ci ${{ github.job }} ubuntu-latest 01-m2-gate
        run: >-
          uv run python toolbox/validators/m2_cross_platform.py gate
          runs/xp-in/macos-15-intel.json runs/xp-in/ubuntu-latest.json runs/xp-in/macos-latest.json
          --revision "${{ github.sha }}" --run-id "${{ github.run_id }}"
          --report runs/proof/m2_cross_platform.json

      - name: Upload gate report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-cross-platform-gate
          path: |
            runs/proof/
            runs/xp-in/

      - name: Check recording completeness (recording-only)
        if: always()
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/90-checker
          S3REC_LABEL: ci ${{ github.job }} ubuntu-latest 90-checker
        run: >-
          .venv/bin/python -I .github/recording/check_ci_records.py records --job gate
          --platform ubuntu-latest --root "$RUNNER_TEMP/s3rec" --out "$RUNNER_TEMP/s3rec/CHECK.json"

      # The completeness checker's own record exists only after it exits; this step checks it.
      # This step's own record is checked offline from the uploaded artifact.
      - name: Check the completeness checker's own record (recording-only)
        if: always()
        env:
          S3REC_DIR: ${{ runner.temp }}/s3rec/91-checker-own
          S3REC_LABEL: ci ${{ github.job }} ubuntu-latest 91-checker-own
        run: >-
          .venv/bin/python -I .github/recording/check_ci_records.py own --job gate
          --platform ubuntu-latest --dir "$RUNNER_TEMP/s3rec/90-checker"
          --check-json "$RUNNER_TEMP/s3rec/CHECK.json" --out "$RUNNER_TEMP/s3rec/OWN-CHECK.json"

      - name: Upload recording evidence (recording-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3rec-gate
          path: ${{ runner.temp }}/s3rec/
          if-no-files-found: error
